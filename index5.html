<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lost & Found Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">AI Lost & Found Matcher</h1>
            <p class="text-gray-600 mt-2">Enter descriptions for the lost and found items to see if they're a match</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="lost-item-desc" class="block text-sm font-medium text-gray-700 mb-2">Description of the LOST Item</label>
                <textarea id="lost-item-desc" rows="6" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="e.g., 'Blue Milton water bottle with a small dent.'"></textarea>
            </div>
            <div>
                <label for="found-item-desc" class="block text-sm font-medium text-gray-700 mb-2">Description of the FOUND Item</label>
                <textarea id="found-item-desc" rows="6" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="e.g., 'Found a blue water bottle.'"></textarea>
            </div>
        </div>

        <div class="text-center mb-6">
            <button id="submit-button" class="w-full md:w-auto bg-blue-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
                Check for Match
            </button>
        </div>

        <div id="result-container" class="bg-gray-50 rounded-lg p-6 min-h-[100px] border border-gray-200 hidden">
            <div id="loading-spinner" class="spinner mx-auto hidden"></div>
            <div id="error-message" class="text-red-600 text-center hidden"></div>
            <div id="result-text"></div>
        </div>

    </div>

    <script>
        // This 'DOMContentLoaded' event listener is the key fix. 
        // It ensures that the script only runs AFTER the entire HTML page has loaded.
        document.addEventListener('DOMContentLoaded', () => {

            const API_KEY = "AIzaSyDu5P7G2LecXMAeyr5zSqxXgRSvBBX_JCM"; // <-- PASTE YOUR KEY HERE
            
            // THE FIX: Trying a different, widely available model name.
            const MODEL_NAME = "gemini-2.5-flash";

            const submitButton = document.getElementById('submit-button');
            const lostItemDesc = document.getElementById('lost-item-desc');
            const foundItemDesc = document.getElementById('found-item-desc');
            const resultContainer = document.getElementById('result-container');
            const loadingSpinner = document.getElementById('loading-spinner');
            const resultText = document.getElementById('result-text');
            const errorMessage = document.getElementById('error-message');

            async function getAiResponse() {
                resultContainer.classList.remove('hidden');
                loadingSpinner.classList.remove('hidden');
                resultText.textContent = '';
                errorMessage.classList.add('hidden');
                submitButton.disabled = true;

                if (API_KEY === "YOUR_API_KEY") {
                    displayError("Please enter your API Key in the script section.");
                    return;
                }

                const apiUrl = `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
                
                const prompt = `
                You are an AI assistant for a college lost and found. I will give you two descriptions. 
                Your job is to determine if they are the same item. 
                Respond with a 'Match Score' from 0% to 100% and a one-sentence justification for your score.
                Description 1 (Lost Item): "${lostItemDesc.value}"
                Description 2 (Found Item): "${foundItemDesc.value}"`;

                const payload = { contents: [{ parts: [{ text: prompt }] }] };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error.message || `API request failed with status ${response.status}`);
                    }

                    const data = await response.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    resultText.innerHTML = aiText.replace(/(Match Score: \d+%)/, '<strong>$1</strong>');
                } catch (error) {
                    console.error("Error:", error);
                    displayError(`An error occurred. Check the console or verify your API key. Error: ${error.message}`);
                } finally {
                    loadingSpinner.classList.add('hidden');
                    submitButton.disabled = false;
                }
            }
            
            function displayError(message) {
                loadingSpinner.classList.add('hidden');
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
            }

            submitButton.addEventListener('click', () => {
                if (lostItemDesc.value.trim() && foundItemDesc.value.trim()) {
                    getAiResponse();
                } else {
                    resultContainer.classList.remove('hidden');
                    displayError("Please enter a description for both items.");
                }
            });
        });
    </script>
</body>
</html>
